# Шаблон конфигурации PaperBase (без личных данных).
# Рабочий config.toml создаётся при первом запуске; этот файл — образец для раздачи.
# Пути можно указывать абсолютные или относительно папки программы.

[paths]
# Папка с вашими статьями (PDF/TXT/MD/RTF). Пусто = спросим при первом запуске.
corpus_dir = ""
# Папка индекса этой темы (у каждой темы своя).
data_dir = "data"

[embedding]
# Имя модели на HuggingFace ИЛИ путь к локальной папке с моделью.
# Если оставить имя хаба, модель скачается (~2.2 ГБ). Можно положить её вручную
# в папку models/bge-m3 рядом с программой — тогда она подхватится автоматически.
model = "BAAI/bge-m3"
# Запасная лёгкая модель, если основная не тянет по памяти/скорости:
fallback_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
# auto = сам выберет ускоритель: CUDA (NVIDIA) -> MPS (Apple Silicon) -> CPU
device = "auto"
batch_size = 8         # крупные входы -> меньше батч ради запаса видеопамяти

[chunking]
# bge-m3 вмещает до 8192 токенов. 800 — компромисс: больше контекста в векторе,
# но привязка к странице ещё точная (слишком крупный чанк «размывает» вектор).
chunk_tokens = 800
overlap_tokens = 150
min_chars_per_page = 30   # меньше символов на странице -> пробуем OCR

[search]
default_k = 8

[ocr]
languages = "eng+rus"
# Путь к tesseract. Пусто = найдём сам (PATH и типовые места установки).
# OCR нужен только для сканов без текстового слоя; без него они пропускаются.
tesseract_cmd = ""

[crossref]
# Обогащение метаданных по DOI (нужен интернет). Почта — необязательна,
# CrossRef просит её для «вежливого» доступа; можно оставить пустой.
enabled = true
timeout = 5
mailto = ""

[backup]
# Резервные копии базы (SQLite + векторы + config) в data/backups/.
enabled = true
before_ingest = true        # авто-бэкап перед каждой индексацией
keep = 10                   # сколько последних копий хранить (ротация)
min_interval_hours = 12     # авто-бэкап не чаще, чем раз в N часов
